name: v1.0 stage1 CI
on:
  push:
    branches: [main, v1.0]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://ontology:ci_test_password@127.0.0.1:5432/ontology
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontology
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ontology
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontology -d ontology"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[all]"
      - name: Check syntax
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q
