[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-ontology"
version = "1.0.0a0"
description = "Provenance-first automotive specification ingestion (Stage 1 candidate facts)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "SQLAlchemy>=2.0,<3",
  "python-multipart>=0.0.20",
  "PyYAML>=6,<7",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
all = ["psycopg[binary]>=3.2,<4", "pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
ontology = "auto_ontology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auto_ontology = ["schemas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
